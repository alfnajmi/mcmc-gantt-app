services:
  gantt-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "8200:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Bound the on-disk log so the cache HIT/MISS/BYPASS lines survive long
    # enough to compute a real hit rate (days, not a docker-logs snapshot).
    # Harmless if a log aggregator is also collecting stdout — it reads the
    # stream; this only caps the local copy. At LOG_LEVEL=INFO the volume is
    # modest (access + cache lines), so 50MB x 5 retains many days.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - redis-data:/data

volumes:
  redis-data:
