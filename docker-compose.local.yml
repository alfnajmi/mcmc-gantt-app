# Local development override — adds a throwaway Postgres with sample data.
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gantt
      POSTGRES_PASSWORD: gantt
      POSTGRES_DB: gantt
    volumes:
      - gantt_pgdata_local:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/sample_data.sql:/docker-entrypoint-initdb.d/02-sample.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gantt"]
      interval: 5s
      timeout: 3s
      retries: 10

  gantt:
    environment:
      DATABASE_URL: postgresql://gantt:gantt@db:5432/gantt
      CORS_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy

volumes:
  gantt_pgdata_local:
