<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gantt Platform</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.hero { text-align: center; max-width: 500px; }
.hero h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
.hero p { font-size: 15px; color: #64748b; margin-bottom: 24px; }
.links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.links a {
  padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600;
  text-decoration: none; transition: background 0.15s;
}
.links a.primary { background: #2563eb; color: #fff; }
.links a.primary:hover { background: #1d4ed8; }
.links a.secondary { background: #fff; color: #1e293b; border: 1px solid #e2e8f0; }
.links a.secondary:hover { background: #f1f5f9; }
</style>
</head>
<body>
<div class="hero">
  <h1>Gantt Platform</h1>
  <p>Multi-project Gantt chart platform. Create projects, import CSV, and embed charts in any portal.</p>
  <div class="links">
    <a href="/admin" class="primary">Admin Panel</a>
    <a href="/project/persada-phase-1" class="secondary">PERSADA Phase 1</a>
  </div>
</div>
</body>
</html>
