<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gantt Platform</title>
<link rel="stylesheet" href="/static/layout.css" />
<style>
/* Page-specific styles */
.project-table-wrap {
  overflow-x: auto;
}
.project-title-cell {
  font-weight: 600;
  color: var(--color-text);
}
.project-slug {
  font-size: 11px;
  color: var(--color-muted);
  font-family: "SF Mono", Monaco, Consolas, monospace;
}
.project-desc {
  font-size: 12px;
  color: var(--color-muted);
  max-width: 250px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.welcome-section {
  margin-bottom: 24px;
}
.welcome-section h2 {
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 4px;
}
.welcome-section p {
  font-size: 14px;
  color: var(--color-muted);
}
.stats-row {
  display: flex;
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 16px 20px;
  min-width: 120px;
  box-shadow: var(--shadow-sm);
}
.stat-card .stat-value {
  font-size: 24px;
  font-weight: 800;
  color: var(--color-text);
}
.stat-card .stat-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--color-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
</style>
</head>
<body>
<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
        <rect width="36" height="36" rx="8" fill="#eff6ff"/>
        <path d="M8 26L18 8L28 26H8Z" fill="#2563eb" opacity="0.8"/>
        <path d="M13 26L18 16L23 26H13Z" fill="#f59e0b"/>
      </svg>
      <div>
        <div class="logo-text">Gantt Platform</div>
        <div class="logo-sub">Project Management</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="/" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </a>
      <a href="/admin" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Admin Panel</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68 1.65 1.65 0 0 0 10 3.17V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Logout</span>
      </a>
    </div>
  </aside>

  <!-- Main Area -->
  <div class="main-area">
    <!-- Top Header -->
    <header class="top-header">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="header-icon-btn" id="sidebar-toggle" title="Toggle sidebar" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="top-header-title">Home</div>
      </div>
      <div class="top-header-actions">
        <button class="header-icon-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <div class="header-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
      </div>
    </header>

    <!-- Content -->
    <div class="content-area">
      <div class="welcome-section">
        <h2>Projects</h2>
        <p>Select a project to view its Gantt chart, or manage projects from the Admin Panel.</p>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-value" id="stat-count">-</div>
          <div class="stat-label">Total Projects</div>
        </div>
      </div>

      <!-- Project List -->
      <div class="card">
        <div class="card-title">All Projects</div>
        <div class="project-table-wrap">
          <table class="data-table" id="project-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Slug</th>
                <th>Description</th>
                <th>Created</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="project-tbody">
              <tr><td colspan="5" class="empty"><p>Loading projects...</p></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(async function() {
  const tbody = document.getElementById('project-tbody');
  try {
    const res = await fetch('/api/projects');
    if (!res.ok) throw new Error('Failed to fetch');
    const projects = await res.json();

    document.getElementById('stat-count').textContent = projects.length;

    if (projects.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty"><p>No projects yet. Create one from the <a href="/admin">Admin Panel</a>.</p></td></tr>';
      return;
    }

    tbody.innerHTML = projects.map(function(p) {
      const created = new Date(p.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      return '<tr>' +
        '<td class="project-title-cell">' + escHtml(p.title) + '</td>' +
        '<td><span class="project-slug">' + escHtml(p.slug) + '</span></td>' +
        '<td><span class="project-desc">' + escHtml(p.description || '-') + '</span></td>' +
        '<td>' + created + '</td>' +
        '<td><a href="/project/' + encodeURIComponent(p.slug) + '" class="btn sm">View</a></td>' +
      '</tr>';
    }).join('');
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty"><p>Could not load projects.</p></td></tr>';
  }
})();

function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Sidebar toggle
function toggleSidebar() {
  var sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('collapsed');
  localStorage.setItem('sidebar-collapsed', sidebar.classList.contains('collapsed'));
}
// Restore sidebar state
(function() {
  if (localStorage.getItem('sidebar-collapsed') === 'true') {
    document.getElementById('sidebar').classList.add('collapsed');
  }
})();
</script>
</body>
</html>
