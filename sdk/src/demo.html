<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gantt SDK Demo</title>
<style>
body { font-family: -apple-system, sans-serif; margin: 0; padding: 24px; background: #f8fafc; }
h1 { font-size: 20px; margin-bottom: 8px; }
p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
.controls { display: flex; gap: 8px; margin-bottom: 16px; }
.controls button { padding: 8px 16px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
.controls button:hover { background: #f1f5f9; }
</style>
</head>
<body>

<h1>Web Component Demo</h1>
<p>This uses &lt;mcmc-gantt&gt; — no framework needed.</p>

<div class="controls">
  <button onclick="document.querySelector('mcmc-gantt').setAttribute('scale', 'day')">Day</button>
  <button onclick="document.querySelector('mcmc-gantt').setAttribute('scale', 'week')">Week</button>
  <button onclick="document.querySelector('mcmc-gantt').setAttribute('scale', 'month')">Month</button>
</div>

<!-- The Web Component -->
<mcmc-gantt
  project="persada-phase-1"
  api="http://localhost:8200"
  editable
  height="70vh"
></mcmc-gantt>

<!-- Load the SDK -->
<script type="module" src="./GanttElement.js"></script>

<script>
// Listen for events
document.querySelector('mcmc-gantt').addEventListener('task-click', (e) => {
  console.log('Task clicked:', e.detail)
})
</script>

</body>
</html>
