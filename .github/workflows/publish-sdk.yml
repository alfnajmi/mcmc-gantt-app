name: Publish SDK

on:
  pull_request:
    branches: [staging]
    paths:
      - 'sdk/src/**'
      - 'sdk/vite.config.js'
      - 'sdk/package.json'
      - 'sdk/package-lock.json'
  push:
    branches: [staging]
    paths:
      - 'sdk/src/**'
      - 'sdk/vite.config.js'
      - 'sdk/package.json'
      - 'sdk/package-lock.json'
  workflow_dispatch: {}

env:
  # GitHub Packages npm registry. The package scope (@alfnajmi) must match the
  # repository owner or Packages will reject the publish.
  GHP_REGISTRY: https://npm.pkg.github.com
  EXPECTED_PACKAGE: '@alfnajmi/gantt-chart'

permissions:
  contents: read

jobs:
  validate:
    if: github.server_url == 'https://github.com' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@alfnajmi'
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Verify package metadata
        working-directory: sdk
        env:
          EXPECTED_PACKAGE: ${{ env.EXPECTED_PACKAGE }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const expected = process.env.EXPECTED_PACKAGE
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const root = lock.packages?.['']

          if (pkg.name !== expected) {
            throw new Error(`Unexpected package name: ${pkg.name}`)
          }
          if (lock.name !== pkg.name || root?.name !== pkg.name) {
            throw new Error('package-lock.json package name does not match package.json')
          }
          if (lock.version !== pkg.version || root?.version !== pkg.version) {
            throw new Error('package-lock.json version does not match package.json')
          }
          NODE

      - name: Verify package version is unpublished
        working-directory: sdk
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          set +e
          LOOKUP_OUTPUT=$(npm view "${PACKAGE_NAME}@${VERSION}" version --registry="${GHP_REGISTRY}" 2>&1)
          LOOKUP_STATUS=$?
          set -e

          if [ "$LOOKUP_STATUS" -eq 0 ]; then
            echo "::error::${PACKAGE_NAME}@${VERSION} is already published."
            exit 1
          fi
          if printf '%s\n' "$LOOKUP_OUTPUT" | grep -q 'E404'; then
            echo "${PACKAGE_NAME}@${VERSION} is available."
            exit 0
          fi

          printf '%s\n' "$LOOKUP_OUTPUT"
          exit "$LOOKUP_STATUS"

  publish:
    if: >-
      github.server_url == 'https://github.com' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to publish to GitHub Packages with the built-in GITHUB_TOKEN.
      packages: write
    concurrency:
      group: publish-sdk-staging
      cancel-in-progress: false

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@alfnajmi'
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Verify package metadata
        working-directory: sdk
        env:
          EXPECTED_PACKAGE: ${{ env.EXPECTED_PACKAGE }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const expected = process.env.EXPECTED_PACKAGE
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const root = lock.packages?.['']

          if (pkg.name !== expected) {
            throw new Error(`Unexpected package name: ${pkg.name}`)
          }
          if (lock.name !== pkg.name || root?.name !== pkg.name) {
            throw new Error('package-lock.json package name does not match package.json')
          }
          if (lock.version !== pkg.version || root?.version !== pkg.version) {
            throw new Error('package-lock.json version does not match package.json')
          }
          NODE

      - name: Verify package version is unpublished
        working-directory: sdk
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          set +e
          LOOKUP_OUTPUT=$(npm view "${PACKAGE_NAME}@${VERSION}" version --registry="${GHP_REGISTRY}" 2>&1)
          LOOKUP_STATUS=$?
          set -e

          if [ "$LOOKUP_STATUS" -eq 0 ]; then
            echo "::error::${PACKAGE_NAME}@${VERSION} is already published."
            exit 1
          fi
          if printf '%s\n' "$LOOKUP_OUTPUT" | grep -q 'E404'; then
            echo "${PACKAGE_NAME}@${VERSION} is available."
          else
            printf '%s\n' "$LOOKUP_OUTPUT"
            exit "$LOOKUP_STATUS"
          fi

      - name: Build SDK
        working-directory: sdk
        run: npm run build

      - name: Publish to GitHub Packages
        working-directory: sdk
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
